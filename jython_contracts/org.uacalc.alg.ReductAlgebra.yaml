target: org.uacalc.alg.ReductAlgebra
level: file
status: implemented
java_source: org/uacalc/alg/ReductAlgebra.java
notes: |
  get_subreducts.py / jython_comparison/subreducts_mace4_stream.py build
  ReductAlgebra(alg, signature) where signature is a list of Term, and
  ReductAlgebra(name, alg, terms). Java skips term.isaVariable() when
  building operations and otherwise adds term.interpretation(alg).
  Same getName/setName/getOperation/getElement/elementIndex as SmallAlgebra,
  plus superAlgebra().

  Implemented: ReductAlgebra accepts VariableImp / NonVariableTerm / str;
  Java-style interpretation skips variables; operations() and superAlgebra()
  work; getUniverseList() is null; algebraType() is REDUCT. Scripts still
  build NonVariableTerm from the cyclic2 "+" symbol (stringToTerm cannot
  parse "+").
ignore_reason: null
surface:
  package_export: true
  aliases:
    getName: name
    setName: set_name
    getOperation: getOperation
    superAlgebra: super_algebra
    elementIndex: element_index
    getElement: get_element
    getUniverseList: get_universe_list
    algebraType: algebra_type
  static_methods: []
  str_parity: false
testing:
  notes: |
    reduct_algebra_smoke.py is the source of truth for Jython ReductAlgebra.
    On cyclic2 it builds the actual non-variable + term via NonVariableTerm
    (not stringToTerm — "+" is not a valid op-name token), then:
    - ReductAlgebra(alg, [plus]) and ReductAlgebra(name, alg, [plus])
    - operations() count 1; the interpreted op is a TermOperation named
      "\"+(x,y)\"", so getOperation(OperationSymbol("+", 2)) is None
    - operations()[0].intValueAt table is C2's + (0,1,1,0); getOperation
      of that op's own symbol finds it
    - superAlgebra() name+cardinality identity with C2
    - getElement / elementIndex delegated to the super algebra (Java
      getElement(0) is 0 on C2)
    Secondary: variable term and empty list → 0 operations, card 2.

    Do not ignore nops=1 vs 0, missing superAlgebra, or op-table failures.
  task_refs: []
  scripts:
    - path: jython_comparison/scripts/reduct_algebra_smoke.py
      covers:
        - getName
        - setName
        - getOperation
        - superAlgebra
        - elementIndex
        - getElement
        - getUniverseList
        - algebraType
        - cardinality
        - operations
      ignore_lines: []
