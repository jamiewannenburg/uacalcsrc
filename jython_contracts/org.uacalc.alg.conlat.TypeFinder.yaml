target: org.uacalc.alg.conlat.TypeFinder
level: file
status: implemented
java_source: org/uacalc/alg/conlat/TypeFinder.java
notes: |
  Jython TypeFinder surface on uacalc_lib. Constructors TypeFinder(alg) and
  TypeFinder(alg, alpha); init / findTypeSet / isSubtrace / findSubtrace /
  findType overloads dispatch to the Rust TypeFinder. nextPairForSubtrace is
  wrapped as NotImplementedError (mutates caller HashSet/List of IntArray;
  PyO3 does not expose it). main is not wrapped. printSubtrace is a public
  static field, not a method.
ignore_reason: null
