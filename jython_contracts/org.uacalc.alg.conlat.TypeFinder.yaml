  TypeFinder(alg, alpha); init / findTypeSet / isSubtrace / findSubtrace /
  findType overloads dispatch to the Rust TypeFinder. nextPairForSubtrace is
  implemented in the org shim and mutates the caller Set/List the way Java
  does (univHS cleared, unorderedUnivHS persisted, univ appended). main is
