  aliases:
    init: init
    findTypeSet: find_type_set
    isSubtrace: is_subtrace
    findSubtrace: find_subtrace
    findType: find_type
    nextPairForSubtrace: nextPairForSubtrace
  static_methods: []
  str_parity: false
testing:
