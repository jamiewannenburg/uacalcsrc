target: org.uacalc.alg.PowerAlgebra
level: file
status: implemented
java_source: org/uacalc/alg/PowerAlgebra.java
notes: |
  PowerAlgebra(alg, power) and PowerAlgebra(name, alg, power). Java 2-arg
  name is "". getRoot / getPower / parent / parents; inherited ProductAlgebra
  getElement (Horner tuples), getUniverseList (last-index-fastest). Java
  PowerAlgebra.elementIndex always returns -1 because universe() yields
  ArrayLists, not IntArrays — matched in the org wrapper (known Java bug).
  convertToDefaultValueOps throws UnsupportedOperationException.
ignore_reason: null
