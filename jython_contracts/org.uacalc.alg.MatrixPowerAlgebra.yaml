notes: |
  MatrixPowerAlgebra(alg, power) and MatrixPowerAlgebra(name, alg, power).
  Java empty constructor-name default is alg.getName()+"^["+power+"]" when
  getName() is non-null (including "") or power+"-matrix pwoer" when
  getName() is null (Java typo, matched in the org wrapper). power==0
  hits ProductAlgebra.makeOperations IOBE (shim raises IndexOutOfBoundsException).
  getRoot / getPower / getPowerAlgebra / parent / parents; getElement is a
  Horner tuple. convertToDefaultValueOps throws UnsupportedOperationException.
  algebraType is MATRIX_POWER. Java source comments "Not working yet".
