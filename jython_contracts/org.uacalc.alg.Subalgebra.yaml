target: org.uacalc.alg.Subalgebra
level: file
status: implemented
java_source: org/uacalc/alg/Subalgebra.java
notes: |
  get_subreducts.py / jep_check.py construct Subalgebra(alg, gens) from
  SubalgebraLattice iterator BasicSets. Java constructors:
  Subalgebra(alg, int[]), Subalgebra(alg, IntArray),
  Subalgebra(name, alg, int[]), Subalgebra(name, alg, IntArray).
  BasicSet extends IntArray, so Subalgebra(alg, BasicSet) is the IntArray
  overload (also used by SubalgebraLattice.Sg(BasicSet)).

  Public instance API: cardinality, getName/setName, getSubuniverseArray,
  index(k) (Java Arrays.binarySearch encoding), getElement, elementIndex,
  operations / getOperation (restricted to the subuniverse), superAlgebra(),
  con(), sub(), restrictPartition, congruenceAsAlgebra, convertToDefaultValueOps
  UOE. getUniverseList() is null; algebraType() is SUBALGEBRA.
ignore_reason: null
surface:
  package_export: true
  aliases:
    getName: name
    setName: set_name
    getOperation: getOperation
    superAlgebra: super_algebra
    getSubuniverseArray: get_subuniverse_array
    elementIndex: element_index
    getElement: get_element
    index: index
    algebraType: algebra_type
    getUniverseList: get_universe_list
    getUniverseOrder: get_universe_order
    restrictPartition: restrict_partition
    convertToDefaultValueOps: convertToDefaultValueOps
    con: con
    sub: sub
    makeOperationTables: make_operation_tables
    universe: universe
    parent: parent
    parents: parents
  static_methods:
    - congruenceAsAlgebra
  str_parity: false
testing:
  notes: |
    subalgebra_smoke.py is the source of truth for Jython Subalgebra.
    Golden cases in tests/parity/alg/test_cases/sub_prod_quot_cases.py cover
    every wrapped public method including restrictPartition, congruenceAsAlgebra,
    convertToDefaultValueOps UOE, binarySearch missing index, and write/read
    round-trip.
  task_refs:
    - tests/parity/alg/test_cases/sub_prod_quot_cases.py
  scripts:
    - path: jython_comparison/scripts/subalgebra_smoke.py
      covers:
        - algebraType
        - con
        - congruenceAsAlgebra
        - convertToDefaultValueOps
        - elementIndex
        - getElement
        - getName
        - getOperation
        - getSubuniverseArray
        - getUniverseList
        - getUniverseOrder
        - index
        - makeOperationTables
        - parent
        - parents
        - restrictPartition
        - setName
        - sub
        - superAlgebra
        - universe
      ignore_lines:
        - "oneGenerated size"
        - "pass 0 of"
        - "pass 1 of"
        - "pass "
