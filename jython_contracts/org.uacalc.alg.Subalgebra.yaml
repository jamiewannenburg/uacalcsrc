target: org.uacalc.alg.Subalgebra
level: file
status: implemented
java_source: org/uacalc/alg/Subalgebra.java
notes: |
  get_subreducts.py / jep_check.py construct Subalgebra(alg, gens) from
  SubalgebraLattice iterator BasicSets. Java constructors:
  Subalgebra(alg, int[]), Subalgebra(alg, IntArray),
  Subalgebra(name, alg, int[]), Subalgebra(name, alg, IntArray).
  BasicSet extends IntArray, so Subalgebra(alg, BasicSet) is the IntArray
  overload (also used by SubalgebraLattice.Sg(BasicSet)).

  Public instance API used by scripts: cardinality, getName/setName,
  getSubuniverseArray, index(k), getElement, elementIndex, operations /
  getOperation (restricted to the subuniverse), superAlgebra(), con(), sub().

  Implemented: superAlgebra() returns the SmallAlgebra; getUniverseList()
  is null; algebraType() is SUBALGEBRA. Subalgebra.sub() builds the lattice
  of the subalgebra (Java `new SubalgebraLattice(this)`), so the singleton
  {0} of cyclic2 has cardinality 2. Missing index(k) is still reported as
  negative rather than Java's exact binarySearch encoding (script lock).
ignore_reason: null
