    subalgebra_smoke.py is the source of truth for Jython Subalgebra.
    On cyclic2 it builds:
    - Subalgebra(alg, BasicSet {0} from SubalgebraLattice.iterator)
    - Subalgebra("Full", alg, [0, 1])
    - Subalgebra(alg, IntArray([0]))
    After setName, prints cardinality, getSubuniverseArray, index (found
    exact / missing as boolean), getElement / elementIndex, restricted +
    table, superAlgebra() name+card, and con()/sub() cardinalities.

    ignore_lines are SubalgebraLattice progress only.
