target: org.uacalc.alg.FreeAlgebra
level: file
status: implemented
java_source: org/uacalc/alg/FreeAlgebra.java
notes: |
  ~/uacalc free_algebras.py / get_idempotents.py call
  FreeAlgebra(alg, n) and FreeAlgebra(alg, n, makeUniverse, thinGens), plus
  SubProductAlgebra methods getElement, elementIndex, getTerms, getTerm,
  getElementFromTerm, getProductAlgebra, generators, getVariables,
  getIdempotentTerms, and inherited SmallAlgebra getOperation / operations.

  Implemented: FreeAlgebra.getElement / elementIndex return IntArray tuples;
  getTerms / getTerm / getElementFromTerm / getProductAlgebra / generators /
  getVariables / operations / superAlgebra are bound; getIdempotentTerms
  returns Term objects. new_with_progress honors make_universe and thin_gens.
  After thinning, the product is rebuilt (Java BigProductAlgebra(alg,
  gens.get(0).universeSize())) and projections are maximals under the
  homomorphism order. Scripts still call setName so default names are not
  compared.
ignore_reason: null
surface:
  package_export: true
  aliases:
    getName: name
    setName: set_name
    elementIndex: element_index
    getElement: get_element
    getOperation: getOperation
    getUniverseList: get_universe_list
    getTerms: get_terms
    getTerm: get_term
    getElementFromTerm: get_element_from_term
    getProductAlgebra: get_product_algebra
    generators: generators
    getVariables: get_variables
    getIdempotentTerms: get_idempotent_terms
    superAlgebra: super_algebra
    algebraType: algebra_type
  static_methods: []
  str_parity: false
testing:
  notes: |
    free_algebra_smoke.py is the source of truth for Jython FreeAlgebra.
    Constructs F(1) over cyclic2 two ways: FreeAlgebra(alg, 1) and
    FreeAlgebra(alg, 1, True, True). After setName, prints cardinality,
    getUniverseList / getElement / elementIndex (IntArray coords), getTerms /
    getTerm / getElementFromTerm round-trip, getProductAlgebra
    cardinality+factor count, generators, getVariables, getIdempotentTerms,
    operations() count, and getOperation("+") table.

    Expected Java (F(1) over C2, makeUniverse=true): cardinality 2; universe
    elements are IntArrays (not ints); getTerms is [x, +(x,x)];
    getIdempotentTerms is [x] only (+(x,x) is the constant-0 term, not
    idempotent). Unthinned 2-arg product is C2^2 (card 4, 2 factors),
    universe [[0,1],[0,0]]. Thinned 4-arg product has 1 factor (card 2),
    universe [[1],[0]]. + table on free-algebra indices is 1,0,0,1
    (generator is index 0).

    ignore_lines are construction progress only. Do not ignore None vs
    IntArray, missing methods, or name/factor mismatches.
  task_refs: []
  scripts:
    - path: jython_comparison/scripts/free_algebra_smoke.py
      covers:
        - getName
        - setName
        - elementIndex
        - getElement
        - getOperation
        - getUniverseList
        - getTerms
        - getTerm
        - getElementFromTerm
        - getProductAlgebra
        - generators
        - getVariables
        - getIdempotentTerms
        - superAlgebra
        - algebraType
        - cardinality
        - operations
      ignore_lines:
        - "Constructing free"
        - "pass:"
        - "done constructing"
        - "thin "
        - "thin ="
        - "thin coord"
        - "gens coord"
        - "name="
