target: org.uacalc.lat.BasicLattice
level: file
status: implemented
java_source: org/uacalc/lat/BasicLattice.java
notes: |
  CamelCase aliases onto uacalc_lib BasicLattice. Java elements are latdraw
  POElems; Python uses int labels. getUniverseOrder is always null (Java).
  convertToDefaultValueOps raises UnsupportedOperationException. Instance
  dual NPEs via Lattices.dual. makeOrderedSet returns uacalc_lib OrderedSet
  (Java returns latdraw OrderedSet). GUI (getDiagram, getVertices, main, run)
  is not bound. findJoinIrred / findMeetIrred / irredundant* / makeIrredundant*
  / con / sub are bound on the org wrapper (Java algorithms). BasicLattice
  from CongruenceLattice or SubalgebraLattice computes universe + join
  irreducibles first (Java Lattice / Con constructors).
ignore_reason: null
surface:
  package_export: true
  aliases:
    getName: name
    getUniverseList: universe
    joinIrreducibles: join_irreducibles
    meetIrreducibles: meet_irreducibles
    getElement: get_element
    elementIndex: element_index
    algebraType: algebra_type
    getPoset: get_poset
    upperCovers: upper_covers
    lowerCovers: lower_covers
    joinIrredsBelow: join_irreds_below
    meetIrredsAbove: meet_irreds_above
    one: one
    zero: zero
    atoms: atoms
    coatoms: coatoms
    filter: filter
    ideal: ideal
    leq: leq
    join: join
    meet: meet
    cardinality: cardinality
    makeOrderedSet: makeOrderedSet
    findJoinIrred: findJoinIrred
    findMeetIrred: findMeetIrred
    irredundantJoinDecomposition: irredundantJoinDecomposition
    irredundantMeetDecomposition: irredundantMeetDecomposition
    makeIrredundantJoin: makeIrredundantJoin
    makeIrredundantMeet: makeIrredundantMeet
    con: con
    sub: sub
  static_methods: []
  str_parity: false
testing:
  notes: |
    basic_lattice_api.py plus golden cases in tests/parity/lat cover
    cardinality, order, join/meet, irreducibles, covers, filter/ideal,
    algebraType, getUniverseOrder, convertToDefaultValueOps, findJoinIrred /
    findMeetIrred, irredundant join/meet decompositions, con, and sub.
    Extended goldens cover chains of several lengths, N5, M3, Boolean 2^n,
    products, Con(A)/Sub(A) of C2/C3/lat2/N5/M3/ba2, list join/meet,
    filters/ideals, and covers.
  task_refs: []
