        - meetIrredsAbove
        - one
        - zero
        - atoms
        - coatoms
        - filter
        - ideal
        - leq
        - join
        - meet
        - cardinality
        - makeOrderedSet
        - findJoinIrred
        - findMeetIrred
        - irredundantJoinDecomposition
        - irredundantMeetDecomposition
        - makeIrredundantJoin
        - makeIrredundantMeet
        - con
        - sub
      ignore_lines:
        - "labels has size"
        - "ucs has size"
