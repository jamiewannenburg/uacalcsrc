java_source: org/uacalc/alg/UnaryTermsMonoid.java
notes: |
  UnaryTermsMonoid(alg) and UnaryTermsMonoid(alg, includeId). includeId is
  unused in Java. Builds FreeAlgebra(alg,1) and a binary PRODUCT table.
  algebraType is UNARY_TERMS_MONOID. Java stubs: getElement null,
  elementIndex 0, con null, sub null, isUnary false. parent is the
  generating algebra. getUniverseList is the unary term list (Java-style
  Term objects, not free-algebra IntArrays). Constructor prints debug
  lines (ignored in smoke).
