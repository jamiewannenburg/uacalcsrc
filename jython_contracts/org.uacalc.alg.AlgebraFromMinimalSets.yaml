  Extends BasicAlgebra. Constructors: (minAlg), (minAlg, size, maps),
  (name, minAlg), (name, minAlg, connectPts), (name, minAlg, size, maps,
  connectPts). Default size is 3*minAlg.card-2. algebraType is BASIC.
