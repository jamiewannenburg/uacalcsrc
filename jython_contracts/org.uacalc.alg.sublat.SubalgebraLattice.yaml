target: org.uacalc.alg.sublat.SubalgebraLattice
level: file
status: implemented
java_source: org/uacalc/alg/sublat/SubalgebraLattice.java
notes: |
  Used by ~/uacalc as SubalgebraLattice(alg), then .iterator() over subuniverses
  and alg.sub().Sg(gens) (Sg returns a Subalgebra; sg returns a BasicSet).
  Java meet / join(List) / atoms / coatoms / meetIrreducibles / operations are
  identically null and are wrapped as such. GUI (getDiagram, ProgressReport) is
  not bound. con()/sub() of the lattice itself need BasicLattice i32 tables and
  are strict xfails.
