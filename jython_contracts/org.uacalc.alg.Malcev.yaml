testing:
  notes: |
    malcev_smoke.py plus tests/parity/alg/test_cases/malcev_cases.py.
    Tiny algebras: cyclic2, cyclic3, lat2, z3, polin, plus N5, M3, ba2,
    a 2-element semilattice, S3, a 3-element quasigroup, Type1 unary,
    and a seeded random algebra. Path internals and Horowitz searches are
    goldened. Each behavioral method is also run 5 times in
    test_malcev_determinism.py.
  task_refs:
