notes: |
  Static facade matching Java org.uacalc.alg.Malcev. ProgressReport overloads
  accept None; non-None is TypeError. TCT type-set helpers, cube-term blockers,
  path internals (sdPath, jonssonLevelPath, …), nuTermIdempotent_Bad, main,
  and other unwrapped Java methods stay off this surface. Term-finding uses
  Java's F(n) name with thinGens/decompose like `new FreeAlgebra(alg, n, report)`.
  gummTerms(lat2) and primalityTerms(c2, None) are known Java NPEs (null
  ProgressReport.addStartLine) and stay strict xfails.
