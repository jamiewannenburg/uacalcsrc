target: org.uacalc.alg.Malcev
level: file
status: implemented
java_source: org/uacalc/alg/Malcev.java
notes: |
  Static facade matching Java org.uacalc.alg.Malcev. ProgressReport overloads
  accept None; non-None is TypeError. TCT type-set helpers, cube-term blockers,
  sdPath, dayQuadruple, makeCyclicGens, and congruenceModularForIdempotent are
  wrapped (dayQuadruple matches Java's alg.con() test, including the
  typeSetIdempotent types1.add(2) bug). Path internals jonssonLevelPath /
  gummLevelPath / hagemannMitschkeLevelPath / jonssonLevelAux and Horowitz
  searches nuTermIdempotent_Bad / fixedKEdgeIdempotent / fixedKPermIdempotent /
  permLevelIdempotent are implemented in uacalc_lib. main is not wrapped.
  Term-finding uses Java's F(n) name with thinGens/decompose like
  `new FreeAlgebra(alg, n, report)`. gummTerms(lat2) and primalityTerms(c2, None)
  are known Java NPEs (null ProgressReport.addStartLine) and stay strict xfails.
ignore_reason: null
