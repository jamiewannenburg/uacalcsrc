    resetConAndSub: reset_con_and_sub
    getName: name
    setName: set_name
    getOperation: getOperation
    universe: universe
    similarityType: similarityType
    constantOperations: constantOperations
  static_methods: []
  str_parity: false
testing:
  notes: |
    basic_algebra_ops.py builds an algebra with a subclassed AbstractOperation
    and exercises getOperation / getName / setName / universe / similarityType.
    load_cyclic2.py covers getName / getUniverseList / cardinality / con on a
    file-loaded instance (AlgebraIO returns BasicAlgebra).
  task_refs: []
  scripts:
    - path: jython_comparison/scripts/load_cyclic2.py
      covers:
        - getName
        - getUniverseList
        - cardinality
        - con
      ignore_lines:
        - "Universe:"
    - path: jython_comparison/scripts/basic_algebra_ops.py
      covers:
        - getName
        - setName
        - getOperation
        - universe
        - similarityType
        - constantOperations
        - cardinality
        - elementIndex
        - algebraType
        - resetConAndSub
        - getUniverseList
      ignore_lines: []
