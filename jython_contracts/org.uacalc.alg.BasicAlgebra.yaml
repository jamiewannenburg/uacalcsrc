notes: |
  CamelCase aliases and Jython constructor shape used by ~/uacalc scripts:
  BasicAlgebra(name, cardinality, ops) with AbstractOperation subclasses,
  getOperation(OperationSymbol), getName/setName, operations(), universe(),
  similarityType().getOperationSymbols(), cardinality().
ignore_reason: null
