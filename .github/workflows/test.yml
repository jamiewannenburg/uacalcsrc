# Tests: Rust (strict), Jython parity, and Python matrix on master / jython.
name: Tests

on:
  push:
    branches:
      - master
      - jython
  pull_request:
    branches:
      - master
      - jython
  workflow_dispatch:
    inputs:
      python-versions:
        description: 'Python versions to test (comma-separated, e.g., "3.11,3.12" or "all" for all versions)'
        required: false
        default: 'all'
        type: string
      skip-rust-tests:
        description: 'Skip Rust tests'
        required: false
        default: false
        type: boolean
      skip-python-tests:
        description: 'Skip Python tests'
        required: false
        default: false
        type: boolean
      skip-jython-parity:
        description: 'Skip Jython parity job'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  setup:
    name: Setup Test Matrix
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.set-matrix.outputs.python-versions }}
    steps:
      - name: Set Python versions matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo 'python-versions=["3.11","3.12"]' >> $GITHUB_OUTPUT
          elif [ "${{ inputs.python-versions }}" = "all" ] || [ -z "${{ inputs.python-versions }}" ]; then
            echo 'python-versions=["3.11","3.12"]' >> $GITHUB_OUTPUT
          else
            VERSIONS="${{ inputs.python-versions }}"
            IFS=',' read -ra VERSION_ARRAY <<< "$VERSIONS"
            JSON_VERSIONS="["
            for i in "${!VERSION_ARRAY[@]}"; do
              if [ $i -gt 0 ]; then
                JSON_VERSIONS+=","
              fi
              JSON_VERSIONS+="\"${VERSION_ARRAY[i]}\""
            done
            JSON_VERSIONS+="]"
            echo "python-versions=$JSON_VERSIONS" >> $GITHUB_OUTPUT
          fi

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip-rust-tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Build Java wrappers
        run: ant compile-wrappers

      - name: Run Rust tests (main crate)
        env:
          UACALC_STRICT_TESTS: "1"
        run: cargo test --all-features

  jython-parity:
    name: Jython parity (bindings + golden tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip-jython-parity }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Cache uacalc.jar
        id: uacalc-jar
        uses: actions/cache@v5
        with:
          path: jars/uacalc.jar
          key: ${{ runner.os }}-uacalc-jar-${{ hashFiles('org/**/*.java', 'org/**/*.png', 'org/**/*.gif', 'org/**/*.jpg', 'resources/algebras/**', 'build.xml', 'manifest') }}

      - name: Build uacalc.jar from Java sources
        if: steps.uacalc-jar.outputs.cache-hit != 'true'
        run: ant dist-jar

      - name: Confirm jars/uacalc.jar
        run: |
          test -f jars/uacalc.jar
          ls -l jars/uacalc.jar

      - name: Install Jython 2.7.3
        shell: bash
        run: |
          curl -fsSL -o /tmp/jython-installer.jar \
            "https://repo1.maven.org/maven2/org/python/jython-installer/2.7.3/jython-installer-2.7.3.jar"
          java -jar /tmp/jython-installer.jar -s -d "$HOME/jython" -t standard
          echo "$HOME/jython/bin" >> "$GITHUB_PATH"

      - name: Verify Jython
        run: jython --version

      - name: Build Java wrappers
        run: ant compile-wrappers

      - name: Install Maturin
        run: python -m pip install maturin

      - name: Build Python bindings
        run: maturin build --release --out dist

      - name: Install wheel and test dependencies
        run: |
          python -m pip install dist/*.whl
          python -m pip install -e ".[test,jython_comparison]"

      - name: Pytest (parity + Jython example tests)
        env:
          UACALC_STRICT_TESTS: "1"
        run: |
          set -o pipefail
          python -m pytest tests/parity python/uacalc/tests/test_jython_examples_parity.py \
            python/uacalc/tests/test_java_surface.py python/uacalc/tests/test_type_stubs.py \
            -v --tb=short -rs | tee pytest-parity.log
          if grep -E 'missing .*/uacalc\.jar|jython or uacalc\.jar not available' pytest-parity.log; then
            echo "::error::uacalc.jar-dependent tests still skipped"
            exit 1
          fi

      - name: Jython tooling checks
        run: |
          python tools/validate_type_stubs.py
          python tools/jython_contracts_cli.py validate
          python tools/jython_contracts_cli.py check-covers
          python jython_comparison/scripts/generate_parity_inventory.py --verify
          python tools/jython_contracts_cli.py parity-coverage

      - name: Jython vs CPython (contract scripts)
        run: python jython_comparison/run_comparison.py -q

  python-tests:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip-python-tests }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.setup.outputs.python-versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Build Java wrappers
        run: ant compile-wrappers

      - name: Install Maturin
        run: pip install maturin

      - name: Build Python bindings
        run: maturin build --release --out dist

      - name: Install built wheel
        run: pip install dist/*.whl

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Run Python tests
        run: |
          python -m pytest python/uacalc/tests \
            --cov=uacalc_lib \
            --cov-report=html:coverage/python/html \
            --cov-report=term \
            --cov-report=xml:coverage/python/coverage.xml \
            --cov-fail-under=0 \
            -v

      - name: Upload Python coverage
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: coverage/python/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: python-test-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
          retention-days: 7

  jython-summary:
    name: Jython workflow summary
    runs-on: ubuntu-latest
    needs: [rust-tests, jython-parity]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Jython compatibility (subset)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust tests: ${{ needs.rust-tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Jython parity: ${{ needs.jython-parity.result }}" >> "$GITHUB_STEP_SUMMARY"
          rust="${{ needs.rust-tests.result }}"
          jy="${{ needs.jython-parity.result }}"
          if [ "$rust" = "failure" ] || [ "$jy" = "failure" ]; then
            echo "❌ One or more Jython workflow jobs failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$rust" = "cancelled" ] || [ "$jy" = "cancelled" ]; then
            echo "⚠️ One or more Jython workflow jobs were cancelled" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Jython subset passed or was skipped" >> "$GITHUB_STEP_SUMMARY"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [rust-tests, jython-parity, python-tests, jython-summary]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Rust tests: ${{ needs.rust-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Jython parity: ${{ needs.jython-parity.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Python tests: ${{ needs.python-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Jython summary gate: ${{ needs.jython-summary.result }}" >> $GITHUB_STEP_SUMMARY

          RUST_RESULT="${{ needs.rust-tests.result }}"
          JYTHON_RESULT="${{ needs.jython-parity.result }}"
          PYTHON_RESULT="${{ needs.python-tests.result }}"
          JYTHON_SUMMARY="${{ needs.jython-summary.result }}"

          if [ "$RUST_RESULT" = "failure" ] || [ "$JYTHON_RESULT" = "failure" ] || [ "$PYTHON_RESULT" = "failure" ] || [ "$JYTHON_SUMMARY" = "failure" ]; then
            echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [ "$RUST_RESULT" = "cancelled" ] || [ "$JYTHON_RESULT" = "cancelled" ] || [ "$PYTHON_RESULT" = "cancelled" ] || [ "$JYTHON_SUMMARY" = "cancelled" ]; then
            echo "⚠️ Some tests were cancelled" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All tests passed or were skipped" >> $GITHUB_STEP_SUMMARY
          fi