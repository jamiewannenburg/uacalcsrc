[package]
name = "uacalc_lib"
version = "0.1.0"
edition = "2021"
authors = ["UACalc Contributors", "J.J. Wannenburg"]
license = "MIT"
repository = "https://github.com/jamiewannenburg/uacalcsrc"

[lib]
name = "uacalc_lib"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "py-clone"] }
uacalc = { path = ".." }

[dev-dependencies]
# Test dependencies for Python bindings
pyo3 = { version = "0.30", features = ["extension-module", "auto-initialize", "py-clone"] }
tempfile = "3.0"
