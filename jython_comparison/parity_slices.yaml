# Parity work slices — edited by humans/agents. Do NOT auto-generate.
# When you finish work on a slice, update status, owner, last_updated, and notes.
# Run: python jython_comparison/scripts/generate_parity_inventory.py
# to refresh parity_inventory.yaml (class list, wrappers, shim flags).

version: 1

status_values:
  not_started: No shim or tests yet.
  in_progress: Someone actively owns this; update notes with branch or PR.
  shim_complete: org.uacalc Python surface exists; golden/Jython parity not done.
  parity_golden: Shared scripts + pytest agree with Jython on representative cases.
  done: Shim + parity + docs; ready for refactor with regression guard.

binding_scope:
  core: Mathematical / programmatic API expected in scripts (priority).
  examples: Example/demos in org.uacalc.example (often lower bind priority).
  gui: Swing/NetBeans UI (usually out of scope for Jython parity unless needed).

merge_rules:
  - One active owner per slice (set owner to GitHub handle or initials).
  - Touch only this file and your slice directory under python/org/uacalc/... and tests.
  - After changing Java under org/uacalc or java_wrapper wrappers, regenerate parity_inventory.yaml.
  - Conflicts: if two agents need the same slice, split work by "workstream" notes or sub-slice id.

slices:
  - id: core-io
    title: Algebra file IO and readers/writers
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.io
    depends_on: []
    owner: ""
    status: in_progress
    workstreams: []
    parity_tests_dir: tests/parity/io
    notes: Existing python/org/uacalc/io shim; expand methods + goldens.

  - id: core-alg-base
    title: Core algebras (BasicAlgebra, SmallAlgebra, products, …) excluding conlat/op subtrees
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg
    package_excludes:
      - org.uacalc.alg.conlat
      - org.uacalc.alg.op
      - org.uacalc.alg.parallel
      - org.uacalc.alg.sublat
    depends_on:
      - core-io
    owner: ""
    status: in_progress
    workstreams: []
    parity_tests_dir: tests/parity/alg
    notes: Large slice; consider splitting further if multiple agents (document in workstreams).

  - id: core-alg-op
    title: Operation symbols and operations
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg.op
    depends_on:
      - core-alg-base
    owner: ""
    status: not_started
    workstreams: []
    parity_tests_dir: tests/parity/alg_op
    notes: ""

  - id: core-alg-conlat
    title: Congruences, partitions, congruence lattices
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg.conlat
    depends_on:
