    owner: agent-d
    status: parity_golden
    last_updated: "2026-04-18"
    workstreams: []
    parity_tests_dir: tests/parity/fplat
    notes: >-
      Golden tests/parity/fplat/golden_fplat_surface.py + fixtures + test_fplat_golden_surface.py. Rust shim ctor
      differs from JAR (Jython fixture records ctor note; CPython prints SMOKE_T_STR). agent-d.

  - id: core-util
    title: Shared util (IntArray, generators, …)
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.util
    depends_on: []
    owner: agent-a
    status: parity_golden
    last_updated: "2026-04-18"
    workstreams:
      - >-
        core-types (agent-f): org.uacalc.types shim + tests/parity/types. There is no
        org.uacalc.* Java package for ``types`` in parity_inventory, so this workstream is
        tracked here instead of a separate slice row (avoids validate_parity_slices gaps).
        uacalc_lib.types is a Rust stub module until IDE/type stubs land.
    parity_tests_dir: tests/parity/util
    notes: >-
      python/org/uacalc/util delegates to uacalc_lib.util with Java aliases; org.uacalc.util.virtuallist
      shim maps LongList/TupleWithMin/VirtualLists. Golden tests/parity/util/golden_util_surface.py +
      fixtures. parity_inventory regenerated. agent-a. See workstreams for org.uacalc.types.

  - id: examples-org
    title: org.uacalc.example scripts and demos
    binding_scope: examples
    java_package_prefixes:
      - org.uacalc.example
