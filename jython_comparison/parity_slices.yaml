# Parity work slices — edited by humans/agents. Do NOT auto-generate.
# When you finish work on a slice, update status, owner, last_updated, and notes.
# Run: python jython_comparison/scripts/generate_parity_inventory.py
# to refresh parity_inventory.yaml (class list, wrappers, shim flags).

version: 1

status_values:
  not_started: No shim or tests yet.
  in_progress: Someone actively owns this; update notes with branch or PR.
  shim_complete: org.uacalc Python surface exists; golden/Jython parity not done.
  parity_golden: Shared scripts + pytest agree with Jython on representative cases.
  done: Shim + parity + docs; ready for refactor with regression guard.

binding_scope:
  core: Mathematical / programmatic API expected in scripts (priority).
  examples: Example/demos in org.uacalc.example (often lower bind priority).

merge_rules:
  - One active owner per slice (set owner to GitHub handle or initials).
  - Touch only this file and your slice directory under python/org/uacalc/... and tests.
  - After changing Java under org/uacalc or java_wrapper wrappers, regenerate parity_inventory.yaml.
  - Conflicts: if two agents need the same slice, split work by "workstream" notes or sub-slice id.

slices:
  - id: core-io
    title: Algebra file IO and readers/writers
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.io
    depends_on: []
    owner: agent-a
    status: parity_golden
    last_updated: "2026-10-16"
    workstreams: []
    parity_tests_dir: tests/parity/io
    notes: >-
      File-level contracts for AlgebraIO / AlgebraReader / AlgebraWriter /
      ExtFileFilter / Mace4Reader / BadAlgebraFileException; JSONChannel ignored.
      write_free_algebra emits Java <freeAlgebra> coordinate tuples; reader
      rebuilds F(n) (known Java bug: Java returns the generating algebra).
      Product/power/quotient/subalgebra writers remain stubs
      (to_basic_algebra route) and nested typed reads are flagged. Branch
      cursor/lat-coverage.

  - id: core-alg-base
    title: Core algebras (BasicAlgebra, SmallAlgebra, products, …) excluding conlat/op subtrees
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg
    package_excludes:
      - org.uacalc.alg.conlat
      - org.uacalc.alg.op
      - org.uacalc.alg.parallel
      - org.uacalc.alg.sublat
    depends_on:
      - core-io
    owner: cursor-agent
    status: parity_golden
    last_updated: "2026-10-16"
    workstreams: []
    parity_tests_dir: tests/parity/alg
    notes: >-
      Algebra / SmallAlgebra / BasicAlgebra plus Subalgebra, ProductAlgebra,
      PowerAlgebra, QuotientAlgebra/QuotientElement, SubProductAlgebra,
      FreeAlgebra, Homomorphism, Closer, Algebras, AlgebraFromMinimalSets,
      AlgebraWithGeneratingVector, GeneralAlgebra, MatrixPowerAlgebra,
      ParameterizedAlgebra, PolinLikeAlgebra, ReductAlgebra, and
      UnaryTermsMonoid (no Malcev) Jython shims on org.uacalc.alg with golden
      behavioral cases in tests/parity/alg, including AlgebraIO write/read
      value round-trips and Java-named conversion-path exceptions. CloserTiming
      is UI-only and is not wrapped. Branch cursor/alg-leftovers.
      Leftovers from PR #58: ReductAlgebra.congruenceAsAlgebra;
      PolinLikeAlgebra.constructPolinAlgebra / polinizeOperation;
      AlgebraWithGeneratingVector.siDecompose relations overload;
      GeneralAlgebra empty-universe constructor;
      UnaryTermsMonoid.getUniverseList (Java-style terms).

  - id: core-alg-op
    title: Operation symbols and operations
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg.op
    depends_on:
      - core-alg-base
    owner: cursor-agent
    status: parity_golden
    last_updated: "2026-10-13"
    workstreams: []
    parity_tests_dir: tests/parity/alg_op
    notes: >-
      Operation / Operations / SimilarityType Jython shims on org.uacalc.alg.op
      with golden behavioral cases in tests/parity/alg_op, including SimilarityType
      value round-trip (equals/hashCode/toString/compareTo) and Java-named
      conversion-path exceptions. Groovy makeOperationFromScript is not wrapped.
      Branch cursor/operation-similaritytype-7472.

  - id: core-alg-conlat
    title: Congruences, partitions, congruence lattices
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg.conlat
    depends_on:
      - core-alg-base
    owner: cursor-agent
    status: parity_golden
    last_updated: "2026-10-15"
    workstreams: []
    parity_tests_dir: tests/parity/conlat
    notes: >-
      Partition / BasicPartition / CongruenceLattice Jython shims on
      org.uacalc.alg.conlat with golden behavioral cases in tests/parity/conlat,
      including array/toString value round-trips and Java-named conversion-path
      exceptions. UI, ProgressReport, main, toMatt, generalizedWeakClosure,
      closureAt, projection, and termMap overloads are not wrapped. TypeFinder /
      Subtrace / Polymorphisms / CentralityData are not this wrap. Branch
      cursor/congruences-4252.

  - id: core-alg-parallel
    title: Parallel closers / pool (if exposed to scripts)
    binding_scope: core
