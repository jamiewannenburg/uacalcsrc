    owner: agent-b
    status: shim_complete
    last_updated: "2026-04-18"
    workstreams: []
    parity_tests_dir: tests/parity/conlat
    notes: >-
      python/org/uacalc/alg/conlat/__init__.py; uacalc_lib.alg.conlat not bound yet (empty CPython
      namespace). tests/parity/conlat/test_conlat_shim_smoke.py. agent-b.

  - id: core-alg-parallel
