  - id: core-group
    title: Permutation groups
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.group
    depends_on:
      - core-alg-base
    owner: group-coverage
    status: parity_golden
    last_updated: "2026-10-16"
    workstreams: []
    parity_tests_dir: tests/parity/group
    notes: >-
      File-level contract for PermutationGroup (only public class in
      org.uacalc.group). 7/7 Java public methods wrapped and behaviorally
      tested (100%). Goldens cover static prod/inv/id, make*Op.valueAt,
      constructors, GeneralAlgebra shell (cardinality -1, null
      universe/operations), and closure of S_n / C_n / D_n / V4 plus
      degree-1 and empty-generator edges. Java never installs operations on
      the instance; group listing is computed from the static ops. Surface
      golden still uses getName (avoid Java default str @ identity).
      uacalc_lib extras to_basic_algebra / automorphism_group are not on the
      Java class (Rust to_basic_algebra uses the underlying set, not |G|).
      0 strict xfails. Branch group-coverage.

