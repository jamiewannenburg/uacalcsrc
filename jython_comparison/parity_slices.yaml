    notes: >-
      File-level contracts for Lattices / BasicLattice / OrderedSets / Order /
      SmallLattice; Lattice ignored (interface, methods on BasicLattice).
      Behavioral goldens cover join/meet/order, irreducibles, covers, filter/ideal,
      OrderedSet univ/leq/covers, makeOrderedSet, generic Order.leq maximals
