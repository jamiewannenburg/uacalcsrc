# Parity work slices — edited by humans/agents. Do NOT auto-generate.
# When you finish work on a slice, update status, owner, last_updated, and notes.
# Run: python jython_comparison/scripts/generate_parity_inventory.py
# to refresh parity_inventory.yaml (class list, wrappers, shim flags).

version: 1

status_values:
  not_started: No shim or tests yet.
  in_progress: Someone actively owns this; update notes with branch or PR.
  shim_complete: org.uacalc Python surface exists; golden/Jython parity not done.
  parity_golden: Shared scripts + pytest agree with Jython on representative cases.
  done: Shim + parity + docs; ready for refactor with regression guard.

binding_scope:
  core: Mathematical / programmatic API expected in scripts (priority).
  examples: Example/demos in org.uacalc.example (often lower bind priority).

merge_rules:
  - One active owner per slice (set owner to GitHub handle or initials).
  - Touch only this file and your slice directory under python/org/uacalc/... and tests.
  - After changing Java under org/uacalc or java_wrapper wrappers, regenerate parity_inventory.yaml.
  - Conflicts: if two agents need the same slice, split work by "workstream" notes or sub-slice id.

slices:
  - id: core-io
    title: Algebra file IO and readers/writers
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.io
    depends_on: []
    owner: agent-a
    status: parity_golden
    last_updated: "2026-04-18"
    workstreams: []
    parity_tests_dir: tests/parity/io
    notes: >-
      python/org/uacalc/io re-exports uacalc_lib.io + AlgebraIO shim + JSONChannel placeholder until Rust
      binds it. Golden stdout tests/parity/io/golden_io_surface.py + fixtures; test_io_shim_imports.py.
      parity_inventory regenerated. agent-a.

  - id: core-alg-base
    title: Core algebras (BasicAlgebra, SmallAlgebra, products, …) excluding conlat/op subtrees
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg
    package_excludes:
      - org.uacalc.alg.conlat
      - org.uacalc.alg.op
      - org.uacalc.alg.parallel
      - org.uacalc.alg.sublat
    depends_on:
      - core-io
    owner: agent-b
    status: parity_golden
    last_updated: "2026-04-18"
    workstreams: []
    parity_tests_dir: tests/parity/alg
    notes: >-
      Golden smoke: tests/parity/alg/golden_alg_core_surface.py + fixtures + test_alg_core_golden_smoke.py
      (BasicAlgebra tiny algebra; CPython vs Jython stdout). agent-b.

  - id: core-alg-op
    title: Operation symbols and operations
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg.op
    depends_on:
      - core-alg-base
    owner: agent-e
    status: parity_golden
    last_updated: "2026-04-18"
    workstreams: []
    parity_tests_dir: tests/parity/alg_op
    notes: >-
      parity_golden: golden_alg_op_surface.py + per-runtime fixtures; Jython exercises
      OperationSymbol/AbstractIntOperation samples; CPython records empty shim until uacalc_lib.alg.op
      binds. Cross-runtime behavioral parity is a future Rust follow-up.

  - id: core-alg-conlat
    title: Congruences, partitions, congruence lattices
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg.conlat
    depends_on:
      - core-alg-base
    owner: agent-e
    status: parity_golden
    last_updated: "2026-04-18"
    workstreams: []
    parity_tests_dir: tests/parity/conlat
    notes: >-
      parity_golden: golden_conlat_surface.py + fixtures (Jython BasicPartition join sample; CPython
      empty namespace). uacalc_lib.alg.conlat wiring remains future work.

  - id: core-alg-parallel
    title: Parallel closers / pool (if exposed to scripts)
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg.parallel
    depends_on:
      - core-alg-base
    owner: agent-e
    status: parity_golden
    last_updated: "2026-04-18"
    workstreams: []
    parity_tests_dir: tests/parity/parallel
    notes: >-
      parity_golden: golden_parallel_surface.py documents Pool on Jython vs uacalc_lib.alg.Pool on
      CPython while org.uacalc.alg.parallel shim may stay empty.

  - id: core-alg-sublat
    title: Subalgebra lattice
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg.sublat
    depends_on:
      - core-alg-conlat
    owner: agent-e
    status: parity_golden
    last_updated: "2026-04-18"
    workstreams: []
    parity_tests_dir: tests/parity/sublat
    notes: >-
      parity_golden: golden_sublat_surface.py + fixtures (Jython BasicSet sample; CPython empty).
      uacalc_lib.alg.sublat remains a future binding target.

  - id: core-element
    title: Elements and subproduct elements
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.element
    depends_on:
      - core-alg-base
    owner: agent-e
    status: parity_golden
    last_updated: "2026-04-18"
    workstreams: []
    parity_tests_dir: tests/parity/element
    notes: >-
      parity_golden: golden_element_surface.py + fixtures + export checks. Deeper behavioral parity
      still tracks uacalc_lib.element coverage vs the JAR.

  - id: core-eq
    title: Equations and presentations
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.eq
    depends_on:
