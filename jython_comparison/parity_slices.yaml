# Parity work slices — edited by humans/agents. Do NOT auto-generate.
# When you finish work on a slice, update status, owner, last_updated, and notes.
# Run: python jython_comparison/scripts/generate_parity_inventory.py
# to refresh parity_inventory.yaml (class list, wrappers, shim flags).

version: 1

status_values:
  not_started: No shim or tests yet.
  in_progress: Someone actively owns this; update notes with branch or PR.
  shim_complete: org.uacalc Python surface exists; golden/Jython parity not done.
  parity_golden: Shared scripts + pytest agree with Jython on representative cases.
  done: Shim + parity + docs; ready for refactor with regression guard.

binding_scope:
  core: Mathematical / programmatic API expected in scripts (priority).
  examples: Example/demos in org.uacalc.example (often lower bind priority).

merge_rules:
  - One active owner per slice (set owner to GitHub handle or initials).
  - Touch only this file and your slice directory under python/org/uacalc/... and tests.
  - After changing Java under org/uacalc or java_wrapper wrappers, regenerate parity_inventory.yaml.
  - Conflicts: if two agents need the same slice, split work by "workstream" notes or sub-slice id.

slices:
  - id: core-io
    title: Algebra file IO and readers/writers
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.io
    depends_on: []
    owner: agent-a
    status: parity_golden
    last_updated: "2026-10-17"
    workstreams: []
    parity_tests_dir: tests/parity/io
    notes: >-
      File-level contracts for AlgebraIO / AlgebraReader / AlgebraWriter /
      ExtFileFilter / Mace4Reader / BadAlgebraFileException; JSONChannel ignored.
      write_free_algebra emits Java <freeAlgebra> coordinate tuples; reader
      rebuilds F(n) (known Java bug: Java returns the generating algebra).
      Product/power/quotient/subalgebra/subproduct typed XML is written and
      rebuilt in the org.io wrapper (Rust SmallAlgebra writer stays a stub).
      Nested Java fixtures reread as ProductAlgebra/PowerAlgebra/etc. Remaining
      io xfails: FreeAlgebra reader Java bug; AlgebraIO/AlgebraReader list
      last-only Java bug; PowerAlgebra Horner/tuple encoding vs cyclic-on-4;
      Subalgebra Jython serialize Class@hex vs typed rebuild. Branch
      example-io-tooling-leftovers.

  - id: core-alg-base
    title: Core algebras (BasicAlgebra, SmallAlgebra, products, …) excluding conlat/op subtrees
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg
    package_excludes:
      - org.uacalc.alg.conlat
      - org.uacalc.alg.op
      - org.uacalc.alg.parallel
      - org.uacalc.alg.sublat
    depends_on:
      - core-io
    owner: cursor-agent
    status: parity_golden
    last_updated: "2026-10-17"
    workstreams: []
    parity_tests_dir: tests/parity/alg
    notes: >-
      Algebra / SmallAlgebra / BasicAlgebra plus Subalgebra, ProductAlgebra,
      PowerAlgebra, QuotientAlgebra/QuotientElement, SubProductAlgebra,
      FreeAlgebra, Homomorphism, Closer, Algebras, AlgebraFromMinimalSets,
      AlgebraWithGeneratingVector, GeneralAlgebra, MatrixPowerAlgebra,
      ParameterizedAlgebra, PolinLikeAlgebra, ReductAlgebra, and
      UnaryTermsMonoid (no Malcev) Jython shims on org.uacalc.alg with golden
      behavioral cases in tests/parity/alg, including AlgebraIO write/read
      value round-trips and Java-named conversion-path exceptions. CloserTiming
      is UI-only and is not wrapped. Former PR #58 leftovers now have passing
      goldens: ReductAlgebra.congruenceAsAlgebra, PolinLikeAlgebra.constructPolinAlgebra
      / polinizeOperation, AlgebraWithGeneratingVector.siDecompose relations,
      GeneralAlgebra empty-universe constructor, UnaryTermsMonoid.getUniverseList.
      FreeAlgebra.getVariableToGeneratorMap has behavioral goldens on F(1)/F(2)
      over cyclic2 plus F(1) over cyclic3, lat2, n5, and m3. Malcev and
      BigProductAlgebra remain pending.

  - id: core-alg-op
    title: Operation symbols and operations
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg.op
    depends_on:
      - core-alg-base
    owner: cursor-agent
    status: parity_golden
    last_updated: "2026-10-17"
    workstreams: []
    parity_tests_dir: tests/parity/alg_op
    notes: >-
      Operation / Operations / SimilarityType plus leftover AbstractIntOperation,
      TermOperation/TermOperationImp, ParameterizedOperation, and
      OperationWithDefaultValue Jython shims on org.uacalc.alg.op with golden
      behavioral cases in tests/parity/alg_op, including SimilarityType value
      round-trip and Java-named conversion-path exceptions. Groovy
      makeOperationFromScript is not wrapped. Strict xfail:
      ow_random_xfail (Java UI RandomGenerator vs Python random for
      defaultValue==-2). Branch conlat-op-leftovers.

  - id: core-alg-conlat
    title: Congruences, partitions, congruence lattices
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg.conlat
    depends_on:
      - core-alg-base
    owner: cursor-agent
    status: parity_golden
    last_updated: "2026-10-17"
    workstreams: []
    parity_tests_dir: tests/parity/conlat
    notes: >-
      Partition / BasicPartition / CongruenceLattice plus leftover TypeFinder,
      Subtrace, Polymorphisms, CentralityData, BinaryRelation, and
      BasicBinaryRelation Jython shims on org.uacalc.alg.conlat with golden
      behavioral cases in tests/parity/conlat, including array/toString value
      round-trips and Java-named conversion-path exceptions. UI, ProgressReport,
      main, toMatt, generalizedWeakClosure, closureAt, projection, and termMap
      overloads are not wrapped. Strict xfail: tf_next_pair_unbound
      (nextPairForSubtrace mutates caller HashSet/List of IntArray; not in
      PyO3). Branch conlat-op-leftovers.

  - id: core-alg-parallel
    title: Parallel closers / pool (if exposed to scripts)
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg.parallel
    depends_on:
      - core-alg-base
    owner: cursor-agent
    status: parity_golden
    last_updated: "2026-10-16"
    workstreams: []
    parity_tests_dir: tests/parity/parallel
    notes: >-
      org.uacalc.alg.parallel exports Pool and SingleClose. Behavioral goldens
      compare sequential vs parallel Closer.sgClose (Closer.doParallel) and
      SingleClose.doOneStep on several algebras; results are sorted universes.
      Timing, thread counts, ForkJoinPool/ProgressReport/CloserTiming, and the
      parallel term map are deliberately skipped (non-deterministic /
      thread-internal). SingleClose.main is an empty stub. Small algebras take
      the serial SingleClose path (computationSize < 1e6). Strict xfails:
      single_close_c2_one_step / single_close_m3_one_step (Java
      IntOperation.valueAt(int[][]) is UOE; Rust uses value_at_arrays). Branch
      fplat-parallel-coverage.

  - id: core-alg-sublat
    title: Subalgebra lattice
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.alg.sublat
    depends_on:
      - core-alg-conlat
    owner: agent-e
    status: parity_golden
    last_updated: "2026-10-16"
    workstreams: []
    parity_tests_dir: tests/parity/sublat
    notes: >-
      Behavioral parity for BasicSet and SubalgebraLattice (branch sublat-coverage).
      Goldens from Jython; org shim matches Java stubs (meet/join(List)/atoms null),
      Sg→Subalgebra, and the BasicSet.union index bug. Strict xfails: getDiagram
      (GUI), Sub.con/sub of the lattice (BasicSet BasicLattice tables), and Java
      union duplicate-keeping. Malcev/GUI out of scope.

  - id: core-element
    title: Elements and subproduct elements
    binding_scope: core
