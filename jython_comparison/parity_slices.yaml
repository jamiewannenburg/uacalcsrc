  - id: core-eq
    title: Equations and presentations
    binding_scope: core
    java_package_prefixes:
      - org.uacalc.eq
    depends_on:
      - core-alg-base
    owner: agent-d
    status: parity_golden
    last_updated: "2026-10-16"
    workstreams: []
    parity_tests_dir: tests/parity/eq
    notes: >-
      Behavioral golden tests/parity/eq plus surface fixtures. Equation / Equations /
