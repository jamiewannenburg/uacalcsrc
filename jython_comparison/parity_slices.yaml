        uacalc_lib.types is a Rust stub module until IDE/type stubs land.
    parity_tests_dir: tests/parity/util
    notes: >-
      Finish wrap+test for org.uacalc.util (branch util-tests-finish). Behavioral
      goldens cover previously wrapped-but-untested methods (SimpleList iterators,
