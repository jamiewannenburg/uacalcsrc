    owner: agent-d
    status: parity_golden
    last_updated: "2026-04-18"
    workstreams: []
    parity_tests_dir: tests/parity/eq
    notes: >-
      Golden tests/parity/eq/golden_eq_surface.py + fixtures + test_eq_golden_surface.py (Jython vs CPython).
      JAR has Equation/Equations/Presentation only; uacalc_lib adds associative_law helpers (fixtures differ).
      agent-d.

  - id: core-lat
    title: Lattices and ordered sets
    binding_scope: core
